<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" fill="#0d0d0d"/>
  <!-- Subtle grid texture -->
  <g stroke="#1a1a1a" stroke-width="1">
    <line x1="0" y1="45" x2="180" y2="45"/>
    <line x1="0" y1="90" x2="180" y2="90"/>
    <line x1="0" y1="135" x2="180" y2="135"/>
    <line x1="45" y1="0" x2="45" y2="180"/>
    <line x1="90" y1="0" x2="90" y2="180"/>
    <line x1="135" y1="0" x2="135" y2="180"/>
  </g>
  <!-- Corner accents -->
  <rect x="0" y="0" width="18" height="18" fill="#00d4aa"/>
  <rect x="162" y="162" width="18" height="18" fill="#00d4aa" opacity="0.4"/>
  <!-- Label strip -->
  <text x="90" y="30" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace"
        font-size="9" fill="#828282" letter-spacing="2">MANTLE NARRATIVE</text>
  <!-- M (Mantle) -->
  <path d="M 30 130 L 30 50 L 47 50 L 64 90 L 81 50 L 98 50 L 98 130 L 84 130 L 84 78 L 70 110 L 58 110 L 44 78 L 44 130 Z"
        fill="#ffffff"/>
  <!-- Cyan dot separator -->
  <rect x="104" y="118" width="12" height="12" fill="#00d4aa"/>
  <!-- N (Narrative) -->
  <path d="M 122 130 L 122 50 L 137 50 L 156 102 L 156 50 L 170 50 L 170 130 L 156 130 L 137 78 L 137 130 Z"
        fill="#ffffff"/>
  <!-- Ticker line at bottom -->
  <line x1="20" y1="155" x2="160" y2="155" stroke="#00d4aa" stroke-width="2"/>
  <circle cx="160" cy="155" r="3" fill="#00d4aa"/>
</svg>
